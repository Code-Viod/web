<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heartopia 攻略站 · Dreams 系统完全指南</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Caveat:wght@400;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg:       #fef9f0;
  --card:     #fffbf5;
  --surface:  #fff8f0;
  --pink:     #e8a0bf;
  --pink-d:   #c97d9e;
  --pink-l:   #fce4ec;
  --lavender: #c4b5e0;
  --lav-d:    #9b8cc4;
  --lav-l:    #ede7f6;
  --amber:    #f4c67a;
  --amber-d:  #d4a44c;
  --amber-l:  #fff3e0;
  --mint:     #80cbc4;
  --mint-l:   #e0f2f1;
  --text:     #4a3f52;
  --text-l:   #7a6f82;
  --text-m:   #a098a8;
  --shadow-sm: 0 2px 12px rgba(180,160,190,0.10);
  --shadow-md: 0 4px 24px rgba(180,160,190,0.16);
  --shadow-lg: 0 8px 40px rgba(180,160,190,0.22);
  --radius-sm: 12px;
  --radius:    20px;
  --radius-lg: 28px;
  --nav-h:     60px;
  --sidebar-w: 220px;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; scroll-padding-top:calc(var(--nav-h) + 20px); }
body {
  font-family:'Quicksand','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  background-image:
    radial-gradient(ellipse at 12% 8%,  rgba(232,160,191,0.07) 0%,transparent 50%),
    radial-gradient(ellipse at 82% 25%, rgba(196,181,224,0.08) 0%,transparent 50%),
    radial-gradient(ellipse at 48% 55%, rgba(244,198,122,0.05) 0%,transparent 50%),
    radial-gradient(ellipse at 18% 78%, rgba(252,225,207,0.10) 0%,transparent 50%);
  background-attachment:fixed;
  min-height:100vh;
}

/* Sparkles */
.sparkles { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.sparkle { position:absolute; border-radius:50%; animation:floatUp 9s infinite; opacity:0; }
.sparkle:nth-child(1){left:8%;  animation-delay:0s;   width:5px;height:5px;background:var(--amber);}
.sparkle:nth-child(2){left:23%; animation-delay:1.3s; width:4px;height:4px;background:var(--pink);}
.sparkle:nth-child(3){left:38%; animation-delay:2.8s; width:6px;height:6px;background:var(--lavender);}
.sparkle:nth-child(4){left:52%; animation-delay:4.1s; width:4px;height:4px;background:var(--amber);}
.sparkle:nth-child(5){left:67%; animation-delay:5.6s; width:5px;height:5px;background:var(--pink);}
.sparkle:nth-child(6){left:82%; animation-delay:6.9s; width:4px;height:4px;background:var(--lavender);}
.sparkle:nth-child(7){left:14%; animation-delay:7.4s; width:5px;height:5px;background:var(--amber);}
.sparkle:nth-child(8){left:58%; animation-delay:3.2s; width:3px;height:3px;background:var(--pink);}
.sparkle:nth-child(9){left:91%; animation-delay:0.9s; width:5px;height:5px;background:var(--lavender);}
.sparkle:nth-child(10){left:35%;animation-delay:5.0s;width:4px;height:4px;background:var(--amber);}
@keyframes floatUp {
  0%   {transform:translateY(105vh) scale(0);opacity:0;}
  10%  {opacity:0.7;}
  90%  {opacity:0.15;}
  100% {transform:translateY(-8vh) scale(1.4);opacity:0;}
}

/* ============================================================
   TOP NAV BAR
   ============================================================ */
.topnav {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  height:var(--nav-h); padding:0 24px;
  background:rgba(254,249,240,0.84);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid rgba(232,160,191,0.14);
  transition:box-shadow 0.3s;
}
.topnav.scrolled { box-shadow:0 2px 20px rgba(180,160,190,0.14); }
.topnav .brand {
  font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:1.3rem; color:var(--text); text-decoration:none;
  display:flex; align-items:center; gap:8px;
}
.topnav .brand .dot { width:10px;height:10px;border-radius:50%;background:var(--pink); }
.topnav-links { display:flex; align-items:center; gap:6px; }
.topnav-links a {
  text-decoration:none; color:var(--text-l); font-weight:600;
  font-size:0.88rem; padding:6px 14px; border-radius:18px;
  transition:all 0.22s; white-space:nowrap;
}
.topnav-links a:hover, .topnav-links a.active { color:var(--pink-d); background:var(--pink-l); }

/* Search button */
.search-btn {
  width:38px; height:38px; border-radius:50%; border:1.5px solid rgba(232,160,191,0.25);
  background:var(--card); cursor:pointer; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.22s; margin-left:8px; color:var(--text-l);
}
.search-btn:hover { border-color:var(--pink); color:var(--pink-d); background:var(--pink-l); }

/* Mobile hamburger */
.hamburger { display:none; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text); padding:4px; }

/* ============================================================
   SEARCH OVERLAY
   ============================================================ */
.search-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(74,63,82,0.55);
  backdrop-filter:blur(6px);
  display:flex; align-items:flex-start; justify-content:center;
  padding-top:14vh;
  opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.search-overlay.open { opacity:1; pointer-events:auto; }
.search-box {
  background:var(--card); border-radius:var(--radius);
  width:min(600px, 92vw); max-height:70vh;
  box-shadow:var(--shadow-lg);
  display:flex; flex-direction:column;
  overflow:hidden;
}
.search-input-wrap {
  display:flex; align-items:center; padding:16px 20px;
  border-bottom:1px solid rgba(232,160,191,0.12);
}
.search-input-wrap input {
  flex:1; border:none; background:none; outline:none;
  font-family:inherit; font-size:1.05rem; color:var(--text);
}
.search-input-wrap input::placeholder { color:var(--text-m); }
.search-input-wrap .close-search {
  background:none; border:none; font-size:1.4rem; cursor:pointer;
  color:var(--text-m); padding:4px 8px; border-radius:8px;
  transition:all 0.2s;
}
.search-input-wrap .close-search:hover { color:var(--pink-d); background:var(--pink-l); }
.search-results { overflow-y:auto; padding:8px; }
.search-results .sr-item {
  display:block; padding:14px 18px; border-radius:var(--radius-sm);
  text-decoration:none; color:var(--text); transition:all 0.2s;
  border-bottom:1px solid rgba(232,160,191,0.05);
}
.search-results .sr-item:hover { background:var(--pink-l); }
.search-results .sr-item .sr-title { font-weight:700; font-size:0.95rem; }
.search-results .sr-item .sr-path { font-size:0.78rem; color:var(--text-m); margin-top:2px; }
.search-results .sr-empty { text-align:center; padding:32px 20px; color:var(--text-m); }

/* ============================================================
   LAYOUT: 2-column (sidebar + main)
   ============================================================ */
.page-layout { display:flex; max-width:1160px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }
.sidebar {
  width:var(--sidebar-w); flex-shrink:0;
  position:sticky; top:calc(var(--nav-h) + 24px);
  align-self:flex-start;
  padding:24px 0 40px; margin-right:32px;
  max-height:calc(100vh - var(--nav-h) - 48px);
  overflow-y:auto;
}
.sidebar-title {
  font-size:0.78rem; font-weight:700; text-transform:uppercase;
  letter-spacing:1px; color:var(--text-m); margin-bottom:12px;
}
.sidebar a {
  display:block; padding:7px 14px; border-radius:10px;
  text-decoration:none; color:var(--text-l); font-size:0.88rem;
  font-weight:500; transition:all 0.2s; margin-bottom:2px;
  border-left:2.5px solid transparent;
}
.sidebar a:hover, .sidebar a.active { color:var(--pink-d); background:var(--pink-l); border-left-color:var(--pink); }
.main-content { flex:1; min-width:0; padding:32px 0 60px; }

/* ============================================================
   BREADCRUMB
   ============================================================ */
.breadcrumb { display:flex; align-items:center; gap:6px; margin-bottom:24px; flex-wrap:wrap; }
.breadcrumb a, .breadcrumb span { font-size:0.85rem; color:var(--text-m); text-decoration:none; }
.breadcrumb a:hover { color:var(--pink-d); }
.breadcrumb .sep { color:var(--text-m); user-select:none; }
.breadcrumb .current { color:var(--text); font-weight:600; }

/* ============================================================
   PAGE: HOME DASHBOARD
   ============================================================ */
.hero-home {
  text-align:center; padding:56px 24px 40px;
  position:relative; z-index:1;
}
.hero-home h1 {
  font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:clamp(2.4rem, 6vw, 4rem); color:var(--text);
  text-shadow:3px 3px 0 rgba(232,160,191,0.12);
}
.hero-home h1 .accent { color:var(--pink-d); }
.hero-home .sub { color:var(--text-m); margin-top:8px; font-size:1.05rem; }
.hero-home .quick-search {
  margin-top:24px; display:inline-flex; align-items:center; gap:10px;
  background:var(--card); border-radius:28px; padding:6px 6px 6px 22px;
  box-shadow:var(--shadow-sm); border:1.5px solid rgba(232,160,191,0.12);
  cursor:pointer; transition:all 0.25s;
}
.hero-home .quick-search:hover { box-shadow:var(--shadow-md); border-color:rgba(232,160,191,0.3); }
.hero-home .quick-search span { color:var(--text-m); font-size:0.9rem; }
.hero-home .quick-search .qs-btn {
  background:var(--pink); color:#fff; border:none;
  padding:10px 20px; border-radius:22px; font-weight:700;
  font-family:inherit; cursor:pointer; font-size:0.88rem;
}

/* System cards grid */
.sys-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
  gap:20px;
  margin-top:8px;
}
.sys-card {
  display:block; text-decoration:none;
  background:var(--card); border-radius:var(--radius); padding:30px 24px 26px;
  box-shadow:var(--shadow-sm); border:1px solid rgba(232,160,191,0.08);
  transition:all 0.3s; text-align:center; position:relative; overflow:hidden;
}
.sys-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-md); }
.sys-card .sys-icon { font-size:2.8rem; display:block; margin-bottom:14px; }
.sys-card .sys-name {
  font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:1.2rem; color:var(--text); margin-bottom:6px;
}
.sys-card .sys-lvl { display:inline-block; padding:3px 12px; border-radius:12px; font-weight:700; font-size:0.78rem; margin-bottom:8px; }
.sys-card .sys-desc { font-size:0.85rem; color:var(--text-m); line-height:1.5; }
.lvl-pink  { background:var(--pink-l); color:var(--pink-d); }
.lvl-lav   { background:var(--lav-l); color:var(--lav-d); }
.lvl-amber { background:var(--amber-l); color:var(--amber-d); }
.lvl-mint  { background:var(--mint-l); color:#4d8c85; }

/* Quick links row */
.quick-links { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
.quick-link {
  flex:1; min-width:140px;
  display:flex; align-items:center; gap:8px;
  padding:14px 18px; border-radius:var(--radius-sm);
  background:var(--card); box-shadow:var(--shadow-sm);
  text-decoration:none; color:var(--text); font-weight:600; font-size:0.9rem;
  transition:all 0.22s; border:1px solid rgba(232,160,191,0.06);
}
.quick-link:hover { background:var(--pink-l); transform:translateY(-2px); }
.quick-link .ql-icon { font-size:1.2rem; }

/* ============================================================
   GUIDE PAGE STYLES
   ============================================================ */
.section-card {
  background:var(--card); border-radius:var(--radius);
  padding:28px 32px; margin-bottom:24px;
  box-shadow:var(--shadow-sm);
  border:1px solid rgba(232,160,191,0.07);
}
.section-card h2 {
  font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:1.35rem; color:var(--text); margin-bottom:18px;
  padding-bottom:12px; border-bottom:2px dashed rgba(232,160,191,0.18);
}
.section-card h3 {
  font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  font-size:1.1rem; color:var(--text); margin:20px 0 10px;
}
.info-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:14px;
}
.info-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:12px 16px; border-radius:var(--radius-sm);
  background:var(--surface);
}
.info-item .ii-icon { font-size:1.25rem; flex-shrink:0; }
.info-item .ii-label { font-weight:700; font-size:0.82rem; color:var(--text); }
.info-item .ii-value { font-size:0.84rem; color:var(--text-l); }

/* Tables */
.tbl-wrap { overflow-x:auto; border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); margin:16px 0; }
table { width:100%; border-collapse:collapse; background:var(--card); border-radius:var(--radius-sm); overflow:hidden; }
thead { background:linear-gradient(135deg, #fef0f5, #f7effc); }
th { padding:13px 18px; text-align:left; font-weight:700; font-size:0.82rem; color:var(--pink-d); text-transform:uppercase; letter-spacing:0.5px; }
td { padding:12px 18px; border-top:1px solid rgba(232,160,191,0.08); font-size:0.9rem; color:var(--text-l); }
tbody tr { transition:background 0.2s; }
tbody tr:hover { background:rgba(254,243,240,0.45); }

/* Badges */
.badge { display:inline-block; padding:3px 12px; border-radius:12px; font-weight:700; font-size:0.8rem; }
.bg-pink  { background:var(--pink-l); color:var(--pink-d); }
.bg-lav   { background:var(--lav-l); color:var(--lav-d); }
.bg-amber { background:var(--amber-l); color:var(--amber-d); }
.bg-mint  { background:var(--mint-l); color:#4d8c85; }

/* Tips */
.tip-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; }
.tip {
  display:flex; gap:12px; align-items:flex-start;
  padding:20px; border-radius:var(--radius-sm);
  background:var(--surface); border:1px solid rgba(232,160,191,0.06);
  transition:all 0.2s;
}
.tip:hover { box-shadow:var(--shadow-sm); }
.tip-num {
  flex-shrink:0; width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:0.88rem;
}
.tn-pink  { background:var(--pink-l); color:var(--pink-d); }
.tn-lav   { background:var(--lav-l); color:var(--lav-d); }
.tn-amber { background:var(--amber-l); color:var(--amber-d); }
.tip h4 { font-size:0.92rem; color:var(--text); margin-bottom:3px; }
.tip p  { font-size:0.84rem; color:var(--text-m); }

/* Level track */
.lvl-track { display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:0; padding:16px 0; }
.lvl-node { text-align:center; padding:0 14px; position:relative; flex:0 0 auto; }
.lvl-node::after { content:'→'; position:absolute; right:-8px; top:22px; color:var(--pink); font-size:1.15rem; font-weight:700; }
.lvl-node:last-child::after { display:none; }
.lvl-circle {
  width:60px; height:60px; border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  margin:0 auto 8px; font-weight:700; font-size:0.78rem; line-height:1.2;
  box-shadow:var(--shadow-sm); transition:transform 0.3s;
}
.lvl-circle:hover { transform:scale(1.08); }
.lc-pink  { background:linear-gradient(135deg,#fce4ec,#f8bbd0); color:#ad1457; }
.lc-lav   { background:linear-gradient(135deg,#ede7f6,#d1c4e9); color:#6a1b9a; }
.lc-amber { background:linear-gradient(135deg,#fff3e0,#ffe0b2); color:#e65100; }
.lc-peach { background:linear-gradient(135deg,#fce4ec,#ffccbc); color:#bf360c; }
.lvl-node .lvl-title { font-weight:700; font-size:0.85rem; color:var(--text); }
.lvl-node .lvl-sub   { font-size:0.75rem; color:var(--text-m); }

/* Reward list */
.reward-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; }
.reward-item {
  display:flex; align-items:center; gap:12px;
  padding:16px 18px; background:var(--card);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-sm);
  border-left:4px solid var(--pink); transition:all 0.2s;
}
.reward-item:nth-child(2n) { border-left-color:var(--lavender); }
.reward-item:nth-child(3n) { border-left-color:var(--amber); }
.reward-item:nth-child(4n) { border-left-color:var(--mint); }
.reward-item:hover { transform:translateX(4px); }
.reward-pts { font-weight:700; font-size:1.05rem; color:var(--pink-d); min-width:55px; }
.reward-name { font-size:0.88rem; color:var(--text); }

/* FAQ */
.faq-list { display:flex; flex-direction:column; gap:10px; }
.faq-item { background:var(--card); border-radius:var(--radius-sm); box-shadow:var(--shadow-sm); overflow:hidden; border:1px solid rgba(232,160,191,0.06); transition:box-shadow 0.3s; }
.faq-item.open { box-shadow:var(--shadow-md); }
.faq-q {
  width:100%; text-align:left; padding:16px 48px 16px 20px;
  border:none; background:none; cursor:pointer;
  font-family:inherit; font-size:0.94rem; font-weight:600; color:var(--text);
  position:relative; display:flex; align-items:center; gap:10px;
}
.faq-q .q-mark { color:var(--pink); font-size:1.15rem; flex-shrink:0; }
.faq-q::after {
  content:'+'; position:absolute; right:18px; top:50%; transform:translateY(-50%);
  font-size:1.25rem; color:var(--pink); font-weight:300; transition:transform 0.3s;
}
.faq-item.open .faq-q::after { transform:translateY(-50%) rotate(45deg); }
.faq-a { max-height:0; overflow:hidden; transition:max-height 0.4s, padding 0.4s; }
.faq-item.open .faq-a { max-height:240px; padding:0 20px 18px; }
.faq-a p { font-size:0.88rem; color:var(--text-l); line-height:1.7; }

/* ============================================================
   FOOTER
   ============================================================ */
.footer {
  text-align:center; padding:36px 24px; color:var(--text-m);
  font-size:0.82rem; border-top:1px solid rgba(232,160,191,0.12);
  position:relative; z-index:1;
}

/* ============================================================
   REVEAL ANIMATION
   ============================================================ */
.reveal { opacity:0; transform:translateY(20px); transition:opacity 0.55s, transform 0.55s; }
.reveal.visible { opacity:1; transform:translateY(0); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:860px) {
  .page-layout { flex-direction:column; }
  .sidebar {
    position:static; width:100%; max-height:none;
    margin-right:0; padding:0 0 16px;
    display:flex; flex-wrap:wrap; gap:4px;
    border-bottom:1px solid rgba(232,160,191,0.10);
    margin-bottom:20px;
  }
  .sidebar-title { width:100%; margin-bottom:4px; }
  .sidebar a { border-left:none; border-bottom:2px solid transparent; border-radius:6px; padding:6px 12px; font-size:0.82rem; }
  .sidebar a.active { border-left-color:transparent; border-bottom-color:var(--pink); }
  .topnav-links a { display:none; }
  .topnav-links .search-btn { display:flex; }
  .hamburger { display:block; }
  .topnav-links.mobile-open a { display:block; }
  .topnav-links.mobile-open {
    position:absolute; top:var(--nav-h); left:0; right:0;
    flex-direction:column; background:var(--card); padding:12px;
    box-shadow:var(--shadow-md); border-bottom:1px solid rgba(232,160,191,0.10);
  }
  .sys-grid { grid-template-columns:1fr 1fr; }
  .info-grid { grid-template-columns:1fr 1fr; }
  .tip-row { grid-template-columns:1fr; }
  .reward-grid { grid-template-columns:1fr 1fr; }
  .section-card { padding:20px 16px; }
  .lvl-track { gap:6px; }
  .lvl-node { padding:0 6px; }
  .lvl-circle { width:50px; height:50px; font-size:0.7rem; }
  .lvl-node::after { right:-6px; top:16px; font-size:1rem; }
}

@media (max-width:480px) {
  .sys-grid { grid-template-columns:1fr; }
  .info-grid { grid-template-columns:1fr; }
  .reward-grid { grid-template-columns:1fr; }
  .quick-links { flex-direction:column; }
  .hero-home h1 { font-size:1.8rem; }
  th, td { padding:10px 10px; font-size:0.78rem; }
}
</style>
</head>
<body>

<div class="sparkles">
  <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
  <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
  <div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div>
  <div class="sparkle"></div>
</div>

<!-- ============================================================
     SEARCH OVERLAY
     ============================================================ -->

<!-- ============================================================
     APPLICATION LOGIC
     ============================================================ -->
<script>
// ── Router ──
function getRoute() {
  const hash = location.hash.slice(1) || '/';
  if (hash === '/') return { page:'home' };
  if (hash.startsWith('/guide/')) {
    const dreamId = hash.replace('/guide/','');
    const dream = D.dreams.find(d => d.id === dreamId);
    return dream ? { page:'guide', dream } : { page:'home' };
  }
  if (hash === '/data') return { page:'data' };
  if (hash === '/faq') return { page:'faq' };
  return { page:'home' };
}

function navigate(hash) {
  location.hash = hash;
}

// ── Render ──
const app = document.getElementById('app');

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k === 'className') el.className = v;
    else if (k === 'innerHTML') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  });
  children.forEach(c => {
    if (typeof c === 'string') el.appendChild(document.createTextNode(c));
    else if (c instanceof Node) el.appendChild(c);
  });
  return el;
}

// ── Shared components ──
function renderBreadcrumb(items) {
  const bc = h('div', {className:'breadcrumb reveal'});
  items.forEach((item, i) => {
    if (i > 0) bc.appendChild(h('span', {className:'sep'}, '›'));
    if (item.href) bc.appendChild(h('a', {href:item.href, onClick(e){ e.preventDefault(); navigate(item.href); }}, item.label));
    else bc.appendChild(h('span', {className:'current'}, item.label));
  });
  return bc;
}

function renderSidebar(links) {
  const sb = h('aside', {className:'sidebar reveal'});
  sb.appendChild(h('div', {className:'sidebar-title'}, '本页目录'));
  links.forEach(l => {
    sb.appendChild(h('a', {href:l.href, onClick(e){ e.preventDefault(); navigate(l.href); }}, l.label));
  });
  return sb;
}

function renderSectionCard(title, contentFn) {
  const card = h('section', {className:'section-card reveal'});
  card.appendChild(h('h2', {}, title));
  contentFn(card);
  return card;
}

function renderTable(headers, rows) {
  const wrap = h('div', {className:'tbl-wrap'});
  const table = h('table');
  const thead = h('thead');
  const trh = h('tr');
  headers.forEach(hdr => trh.appendChild(h('th', {}, hdr)));
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = h('tbody');
  rows.forEach(row => {
    const tr = h('tr');
    row.forEach(cell => tr.appendChild(h('td', {innerHTML:cell})));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

// ── Page: Home ──
function renderHome() {
  app.innerHTML = '';
  const hero = h('div', {className:'hero-home'});
  hero.appendChild(h('h1', {}, h('span', {className:'accent'}, 'Heartopia'), ' 攻略站'));
  hero.appendChild(h('p', {className:'sub'}, 'Dreams 系统完全指南 · 从入门到精通'));
  hero.appendChild(h('div', {className:'quick-search', onClick(){ document.getElementById('searchOverlay').classList.add('open'); document.getElementById('searchInput').focus(); }},
    h('span', {}, '🔍  搜索攻略…'),
    h('button', {className:'qs-btn'}, '搜索')
  ));
  app.appendChild(hero);

  const main = h('div', {className:'main-content', style:'max-width:1040px;margin:0 auto;padding:0 24px 60px;'});

  // System cards
  const grid = h('div', {className:'sys-grid reveal'});
  D.dreams.forEach(d => {
    const card = h('a', {className:'sys-card', href:'#/guide/'+d.id, onClick(e){ e.preventDefault(); navigate('#/guide/'+d.id); }});
    card.appendChild(h('span', {className:'sys-icon'}, d.icon));
    card.appendChild(h('div', {className:'sys-name'}, d.name));
    card.appendChild(h('span', {className:'sys-lvl ' + d.levelColor}, 'Lv.' + d.level + (d.id==='iceskating'?' 冬季':'')));
    card.appendChild(h('p', {className:'sys-desc'}, d.desc));
    grid.appendChild(card);
  });
  main.appendChild(grid);

  // Quick links
  const ql = h('div', {className:'quick-links reveal'});
  [
    { label:'📊 数据速查', href:'#/data' },
    { label:'❓ 常见问题', href:'#/faq' },
    { label:'🧩 Puzzle Dream 攻略', href:'#/guide/puzzle' },
    { label:'📝 Writing Dream 攻略', href:'#/guide/writing' },
    { label:'🎵 Music Dream 攻略', href:'#/guide/music' },
  ].forEach(l => {
    ql.appendChild(h('a', {className:'quick-link', href:l.href, onClick(e){ e.preventDefault(); navigate(l.href); }},
      h('span', {className:'ql-icon'}, l.label.slice(0,2)),
      l.label.slice(3)
    ));
  });
  main.appendChild(ql);
  app.appendChild(main);
  refreshReveal();
}

// ── Page: Guide ──
function renderGuide(dream) {
  app.innerHTML = '';
  const layout = h('div', {className:'page-layout'});

  // Sidebar TOC
  const tocLinks = [
    { label:'📋 基础信息', href:'#/guide/'+dream.id },
    { label:'📝 操作步骤', href:'#/guide/'+dream.id },
  ];
  if (dream.id === 'puzzle') {
    tocLinks.push({ label:'📏 拼图尺寸表', href:'#/guide/puzzle' });
    tocLinks.push({ label:'💡 刷分技巧', href:'#/guide/puzzle' });
  }
  if (dream.tips && dream.tips.length) tocLinks.push({ label:'💡 小贴士', href:'#/guide/'+dream.id });
  layout.appendChild(renderSidebar(tocLinks));

  const main = h('div', {className:'main-content'});

  // Breadcrumb
  main.appendChild(renderBreadcrumb([
    { label:'首页', href:'#/' },
    { label:dream.name }
  ]));

  // Basic info
  const infoCard = renderSectionCard('📋 基础信息', card => {
    const grid = h('div', {className:'info-grid'});
    [
      { icon:'🔑', label:'解锁条件', value:dream.unlock },
      { icon:'🏪', label:'相关地点/商店', value:dream.shop || '—' },
      { icon:'💰', label:'货币', value:dream.currency || '—' },
      { icon:'👤', label:'关键 NPC', value:dream.npc || '—' },
    ].forEach(item => {
      const div = h('div', {className:'info-item'});
      div.appendChild(h('span', {className:'ii-icon'}, item.icon));
      const txt = h('div');
      txt.appendChild(h('div', {className:'ii-label'}, item.label));
      txt.appendChild(h('div', {className:'ii-value', innerHTML:item.value}));
      div.appendChild(txt);
      grid.appendChild(div);
    });
    card.appendChild(grid);
  });
  main.appendChild(infoCard);

  // Steps
  if (dream.steps && dream.steps.length) {
    const stepsCard = renderSectionCard('📝 操作步骤', card => {
      dream.steps.forEach((s, i) => {
        const div = h('div', {style:'display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;'});
        const num = h('span', {style:'flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--pink-l);color:var(--pink-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;margin-top:1px;'}, String(i+1));
        const txt = h('div');
        txt.appendChild(h('h4', {style:'font-size:0.92rem;color:var(--text);margin-bottom:2px;'}, s.title));
        txt.appendChild(h('p', {style:'font-size:0.85rem;color:var(--text-m);'}, s.desc));
        div.appendChild(num); div.appendChild(txt);
        card.appendChild(div);
      });
    });
    main.appendChild(stepsCard);
  }

  // Puzzle-specific: sizes table
  if (dream.id === 'puzzle') {
    const sizeCard = renderSectionCard('📏 拼图尺寸对照表', card => {
      card.appendChild(renderTable(
        ['尺寸', '代号', '碎片数', '推荐用途'],
        D.puzzleSizes.map(s => [
          '<span class="badge '+s.badge+'">'+s.name+'</span>', s.size, String(s.pieces)+' 片', s.tip
        ])
      ));
    });
    main.appendChild(sizeCard);

    // Score actions
    const scoreCard = renderSectionCard('📊 得分行为一览', card => {
      card.appendChild(renderTable(
        ['行为', '得分', '说明'],
        D.scoreActions.map(a => ['🔹 '+a.action, '<strong>'+a.pts+' 分</strong>', a.note])
      ));
    });
    main.appendChild(scoreCard);

    // Level track
    const lvlCard = renderSectionCard('🏆 称号升级路径', card => {
      const track = h('div', {className:'lvl-track'});
      D.levels.forEach(l => {
        const node = h('div', {className:'lvl-node'});
        node.appendChild(h('div', {className:'lvl-circle ' + l.color}, l.pts, l.name));
        node.appendChild(h('div', {className:'lvl-title'}, l.title));
        track.appendChild(node);
      });
      card.appendChild(track);
    });
    main.appendChild(lvlCard);

    // Rewards
    const rewardCard = renderSectionCard('🎁 进度里程碑奖励', card => {
      const grid = h('div', {className:'reward-grid'});
      D.rewards.forEach(r => {
        const item = h('div', {className:'reward-item'});
        item.appendChild(h('span', {className:'reward-pts'}, r.pts));
        item.appendChild(h('span', {className:'reward-name'}, r.icon + ' ' + r.reward));
        grid.appendChild(item);
      });
      card.appendChild(grid);
    });
    main.appendChild(rewardCard);
  }

  // Tips
  if (dream.tips && dream.tips.length) {
    const tipsCard = renderSectionCard('💡 小贴士', card => {
      const row = h('div', {className:'tip-row'});
      const colors = ['tn-pink','tn-lav','tn-amber','tn-pink','tn-lav','tn-amber'];
      dream.tips.forEach((t, i) => {
        const tip = h('div', {className:'tip'});
        tip.appendChild(h('span', {className:'tip-num ' + colors[i%6]}, String(i+1)));
        const txt = h('div');
        txt.appendChild(h('h4', {}, t.title));
        txt.appendChild(h('p', {}, t.desc));
        tip.appendChild(txt);
        row.appendChild(tip);
      });
      card.appendChild(row);
    });
    main.appendChild(tipsCard);
  }

  layout.appendChild(main);
  app.appendChild(layout);
  refreshReveal();
}

// ── Page: FAQ ──
function renderFaq() {
  app.innerHTML = '';
  const layout = h('div', {className:'page-layout'});
  layout.appendChild(renderSidebar(D.faq.map((f, i) => ({ label:f.q, href:'#/faq' }))));
  const main = h('div', {className:'main-content'});
  main.appendChild(renderBreadcrumb([{ label:'首页', href:'#/' }, { label:'常见问题' }]));

  const card = renderSectionCard('❓ 常见问题 FAQ', card => {
    const list = h('div', {className:'faq-list'});
    D.faq.forEach(f => {
      const item = h('div', {className:'faq-item'});
      const qBtn = h('button', {className:'faq-q'});
      qBtn.appendChild(h('span', {className:'q-mark'}, 'Q'));
      qBtn.appendChild(document.createTextNode(f.q));
      qBtn.addEventListener('click', () => {
        const wasOpen = item.classList.contains('open');
        list.querySelectorAll('.faq-item').forEach(el => el.classList.remove('open'));
        if (!wasOpen) item.classList.add('open');
      });
      item.appendChild(qBtn);
      const aDiv = h('div', {className:'faq-a'});
      aDiv.appendChild(h('p', {innerHTML:f.a}));
      item.appendChild(aDiv);
      list.appendChild(item);
    });
    card.appendChild(list);
  });
  main.appendChild(card);

  layout.appendChild(main);
  app.appendChild(layout);
  refreshReveal();
}

// ── Scroll reveal ──
function refreshReveal() {
  document.querySelectorAll('.reveal').forEach(el => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold:0.12, rootMargin:'0px 0px -20px 0px' });
    obs.observe(el);
  });
}

// ── Search ──
const searchOverlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

function openSearch() { searchOverlay.classList.add('open'); setTimeout(() => searchInput.focus(), 100); }
function closeSearch() { searchOverlay.classList.remove('open'); searchInput.value = ''; searchResults.innerHTML = ''; }
document.getElementById('openSearch').addEventListener('click', openSearch);
document.getElementById('closeSearch').addEventListener('click', closeSearch);
searchOverlay.addEventListener('click', e => { if (e.target === searchOverlay) closeSearch(); });

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.innerHTML = ''; return; }
  const results = SEARCH_INDEX.filter(item =>
    item.title.toLowerCase().includes(q) || item.text.toLowerCase().includes(q) || item.path.toLowerCase().includes(q)
  ).slice(0, 12);
  if (results.length === 0) {
    searchResults.innerHTML = '<div class="sr-empty">😕 没有找到相关内容，试试其他关键词</div>';
    return;
  }
  searchResults.innerHTML = '';
  results.forEach(r => {
    const a = h('a', {className:'sr-item', href:r.href, onClick(e){ e.preventDefault(); closeSearch(); navigate(r.href); }});
    a.appendChild(h('div', {className:'sr-title'}, r.title));
    a.appendChild(h('div', {className:'sr-path'}, r.path));
    searchResults.appendChild(a);
  });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
});

// ── Render on route change ──
function render() {
  const route = getRoute();
  switch(route.page) {
    case 'home':  renderHome(); break;
    case 'guide': renderGuide(route.dream); break;
    case 'data':  renderData(); break;
    case 'faq':   renderFaq(); break;
    default:      renderHome();
  }
  // Update active nav
  document.querySelectorAll('.topnav-links a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === location.hash || (location.hash === '' && a.getAttribute('href') === '#/'));
  });
  window.scrollTo({ top:0, behavior:'smooth' });
}

window.addEventListener('hashchange', render);
render();

// Nav scroll shadow
window.addEventListener('scroll', () => {
  document.getElementById('topnav').classList.toggle('scrolled', window.scrollY > 16);
});

// Mobile hamburger
document.getElementById('hamburger').addEventListener('click', () => {
  document.getElementById('topnavLinks').classList.toggle('mobile-open');
});
// Close mobile nav on link click
document.getElementById('topnavLinks').addEventListener('click', (e) => {
  if (e.target.tagName === 'A') document.getElementById('topnavLinks').classList.remove('mobile-open');
});
</script>
